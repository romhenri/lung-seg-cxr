[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lungseg"
version = "0.1.0"
description = "Segmentação de pulmões em raio-X de tórax (projeto educacional)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchvision",
    "segmentation-models-pytorch",
    "albumentations",
    "opencv-python",
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "tqdm",
    "kagglehub",
    "gradio",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
lungseg = "lungseg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
